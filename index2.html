<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>NASA APOD — Picture of the Day</title>
		<meta name="description" content="NASA Astronomy Picture of the Day (APOD) — title, image/video and description." />
		<style>
			:root{--bg1:#0f1724;--bg2:#071029;--card:#0b1220;--accent:#6ee7b7;--muted:#98a6b3}
			*{box-sizing:border-box}
			body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#e6eef6;background:linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
			.container{max-width:1000px;width:100%;}
			.card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:14px;padding:24px;box-shadow:0 8px 30px rgba(2,6,23,0.7);display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
			@media (max-width:900px){.card{grid-template-columns:1fr;}}
			.media{background:#071226;border-radius:10px;padding:12px;display:flex;align-items:center;justify-content:center;min-height:320px}
			.media img{max-width:100%;height:auto;border-radius:8px;display:block;box-shadow:0 6px 20px rgba(2,6,23,0.6)}
			.media iframe{width:100%;height:420px;border:0;border-radius:8px}
			.info{Padding:6px 4px}
			h1{margin:0 0 8px 0;font-size:20px;color:#fff}
			.meta{display:flex;gap:8px;align-items:center;margin-bottom:12px}
			.date{color:var(--muted);font-size:13px}
			.credit{color:var(--muted);font-size:13px;margin-left:auto}
			p.description{color:#d7e7f8;line-height:1.5;margin-top:12px}
			.actions{margin-top:16px;display:flex;gap:8px}
			a.button{background:linear-gradient(90deg,var(--accent),#3dd4c4);padding:10px 14px;border-radius:10px;color:#042426;text-decoration:none;font-weight:600}
			button.secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:10px 12px;border-radius:10px;cursor:pointer}
			.footer{margin-top:18px;color:var(--muted);font-size:13px}
			.loader{width:36px;height:36px;border-radius:50%;border:4px solid rgba(255,255,255,0.06);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:auto}
			@keyframes spin{to{transform:rotate(360deg)}}
			.error{color:#ffb4b4;background:rgba(255,20,20,0.03);padding:10px;border-radius:8px}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="card" id="apodCard">
				<div class="media" id="mediaArea">
					<div class="loader" id="loader" title="Loading"></div>
				</div>
				<div class="info">
					<h1 id="title">Astronomy Picture of the Day</h1>
					<div class="meta">
						<div class="date" id="date">—</div>
						<div class="credit" id="credit"></div>
					</div>
					<p class="description" id="explanation">Loading description…</p>
					<div class="actions">
						<a class="button" id="apodLink" href="https://apod.nasa.gov/apod/astropix.html" target="_blank" rel="noopener">View on APOD</a>
						<button class="secondary" id="reloadBtn">Reload</button>
					</div>
					<div class="footer">Data from NASA API. Using public <strong>DEMO_KEY</strong> — for higher limit, use your API key.</div>
				</div>
			</div>
		</div>

		<script>
			const API = 'https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY';
			const loader = document.getElementById('loader');
			const mediaArea = document.getElementById('mediaArea');
			const titleEl = document.getElementById('title');
			const dateEl = document.getElementById('date');
			const creditEl = document.getElementById('credit');
			const explanationEl = document.getElementById('explanation');
			const apodLink = document.getElementById('apodLink');
			const reloadBtn = document.getElementById('reloadBtn');

			async function loadAPOD(){
				try{
					showLoader(true);
					const res = await fetch(API);
					if(!res.ok) throw new Error('Network response was not ok');
					const data = await res.json();
					renderAPOD(data);
				}catch(err){
					renderError(err.message || 'Failed to load APOD');
				}finally{
					showLoader(false);
				}
			}

			function showLoader(state){
				loader.style.display = state ? 'block' : 'none';
			}

			function clearMedia(){
				mediaArea.innerHTML = '';
			}

			function renderAPOD(data){
				clearMedia();
				titleEl.textContent = data.title || 'Astronomy Picture of the Day';
				dateEl.textContent = data.date || '';
				creditEl.textContent = data.copyright ? `© ${data.copyright}` : '';
				explanationEl.textContent = data.explanation || '';
				apodLink.href = data.url || 'https://apod.nasa.gov/apod/astropix.html';

				if(data.media_type === 'video'){
					const iframe = document.createElement('iframe');
					iframe.src = data.url;
					iframe.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
					iframe.loading = 'lazy';
					mediaArea.appendChild(iframe);
				} else {
					const img = document.createElement('img');
					img.src = data.hdurl || data.url;
					img.alt = data.title || 'APOD image';
					img.loading = 'lazy';
					mediaArea.appendChild(img);
				}
			}

			function renderError(msg){
				clearMedia();
				const err = document.createElement('div');
				err.className = 'error';
				err.textContent = msg;
				mediaArea.appendChild(err);
				titleEl.textContent = 'Unable to load APOD';
				explanationEl.textContent = 'An error occurred fetching the Astronomy Picture of the Day.';
			}

			reloadBtn.addEventListener('click', () => {
				loadAPOD();
			});

			// initial load
			loadAPOD();
		</script>
	</body>
</html>
