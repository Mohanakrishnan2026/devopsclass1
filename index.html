<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Galaxy Rotation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        .galaxy {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .star {
            position: absolute;
            background: radial-gradient(circle, #fff, #aaa);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="galaxy" id="galaxy"></div>
    
    <script>
        const galaxy = document.getElementById('galaxy');
        const starCount = 150;
        
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 180 + 20;
            const size = Math.random() * 3 + 1;
            
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = 200 + Math.cos(angle) * distance + 'px';
            star.style.top = 200 + Math.sin(angle) * distance + 'px';
            star.style.opacity = Math.random() * 0.7 + 0.3;
            
            galaxy.appendChild(star);
        }
    </script>
</body>
</html>
